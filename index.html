<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>후뢰시봉 명예의 전당</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --doctor-white: #f8fafc;
            --boss-blue: #38bdf8;
            --boss-green: #34d399;
            --boss-red: #fb7185;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            background: linear-gradient(135deg, #172036, #0f172a);
            border: 1px solid rgba(248, 250, 252, 0.15);
            border-radius: 16px;
            padding: 24px 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 1.35rem;
            color: var(--doctor-white);
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0;
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem !important;
            box-sizing: border-box;
            font-family: 'Gowun Dodum', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--boss-blue);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 12px;
        }

        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a233a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1.5px solid var(--border-color);
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .rank-badge.top-1 { 
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(217, 119, 6, 0.1)); 
            color: #fde047; 
            border: 2px solid #fbbf24; 
        }
        .rank-badge.top-2 { 
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.15), rgba(148, 163, 184, 0.08)); 
            color: #f8fafc; 
            border: 2px solid #cbd5e1; 
        }
        .rank-badge.top-3 { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(180, 83, 9, 0.08)); 
            color: #fb923c; 
            border: 2px solid #f59e0b; 
        }

        .player-name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 2px;
            word-break: break-all;
        }

        .player-score {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ 초봉식쉼터 후레쉬봉 ⚡</h1>
            <p>🚦실시간 랭킹🚦 (2026/09/11 기준)</p>
        </header>

        <div class="card">
            <h2 style="font-size: 1rem; margin-top: 0; margin-bottom: 12px; color: var(--text-main);">🏆 실시간 랭킹</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 닉네임 검색..." oninput="renderRankings()">
            </div>

            <div class="ranking-list" id="rankingList"></div>
        </div>
    </div>

    <script>
        // 55명 전체 데이터 하드코딩 반영
        const rankings = [
            { name: "세레니님", score: 4512 },
            { name: "백수의왕한울이님", score: 3976 },
            { name: "청년주먹조벤츠님", score: 3548 },
            { name: "MAF6352421님 (나공주)", score: 3351 },
            { name: "핵봉식님", score: 3304 },
            { name: "화랑굇수님 (나공주)", score: 3056 },
            { name: "주영바라기님", score: 2791 },
            { name: "라이레오님", score: 2586 },
            { name: "20211018님", score: 2541 },
            { name: "콧노래벤님", score: 2293 },
            { name: "무과금복귀유저 부방장님", score: 2200 },
            { name: "봉식이오랜만님", score: 2196 },
            { name: "방장", score: 2101 },
            { name: "문년기사김봉식님", score: 2086 },
            { name: "기사식당김봉식님", score: 2067 },
            { name: "야마하님", score: 2056 },
            { name: "주악꾸억주의님", score: 2006 },
            { name: "코끼리코야님", score: 1829 },
            { name: "팀쩔님(나공주)", score: 1827 },
            { name: "야승님(나공주)", score: 1821 },
            { name: "물오뎅님", score: 1794 },
            { name: "칠산동하이바님", score: 1793 },
            { name: "찌림이님", score: 1777 },
            { name: "qekfdsr님", score: 1745 },
            { name: "maf7784418님", score: 1711 },
            { name: "김사덕님", score: 1704 },
            { name: "물갈이님", score: 1674 },
            { name: "케르베로스님", score: 1546 },
            { name: "왕과봉식님", score: 1484 },
            { name: "드가자님", score: 1440 },
            { name: "가가사님", score: 1371 },
            { name: "망빙님", score: 1330 },
            { name: "얄(circ)님", score: 1318 },
            { name: "전준뎅님", score: 1306 },
            { name: "심통 부방장님", score: 1272 },
            { name: "달려라김봉식.님", score: 1253 },
            { name: "통통한새우초밥님", score: 1250 },
            { name: "ㅈㅎㅈㅎ님", score: 1249 },
            { name: "언리밋님", score: 1206 },
            { name: "바렐님", score: 1200 },
            { name: "utg님", score: 1173 },
            { name: "대우로얄뉴로얄 2대방장님", score: 1167 },
            { name: "이나바라기님", score: 1133 },
            { name: "암흑의어둠단검님 (나공주)", score: 1112 },
            { name: "김룡님", score: 1067 },
            { name: "부억님(나공주서버)", score: 1038 },
            { name: "인생은니나노님", score: 1036 },
            { name: "유디님", score: 1014 },
            { name: "봉식을품은달님", score: 1004 },
            { name: "데이세븐님", score: 739 },
            { name: "뜨뜨님", score: 733 },
            { name: "천마백호님", score: 700 },
            { name: "대륙간탄도미사일님", score: 671 },
            { name: "봉식.님", score: 669 },
            { name: "천마봉식.님", score: 345 }
        ];

        function renderRankings() {
            const listEl = document.getElementById("rankingList");
            const searchKeyword = document.getElementById("searchInput").value.toLowerCase().trim();
            listEl.innerHTML = "";

            rankings.sort((a, b) => b.score - a.score);

            const filtered = rankings.filter(player => player.name.toLowerCase().includes(searchKeyword));

            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px;">등록된 기록이 없습니다.</div>`;
                return;
            }

            filtered.forEach((player, displayIndex) => {
                const rank = displayIndex + 1;
                let rankClass = "";

                if (rank === 1) rankClass = "top-1";
                else if (rank === 2) rankClass = "top-2";
                else if (rank === 3) rankClass = "top-3";

                let html = `
                    <div class="ranking-item">
                        <div class="rank-info">
                            <div class="rank-badge ${rankClass}">${rank}</div>
                            <div>
                                <div class="player-name">${escapeHtml(player.name)}</div>
                                <div class="player-score">${player.score.toLocaleString()}점</div>
                            </div>
                        </div>
                    </div>
                `;
                listEl.innerHTML += html;
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        renderRankings();
    </script>

</body>
</html>
