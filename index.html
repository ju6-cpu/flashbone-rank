<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>초봉식쉼터 : 우리동네 후레쉬봉 기록</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --doctor-white: #f8fafc;
            --boss-blue: #38bdf8;
            --boss-green: #34d399;
            --boss-red: #fb7185;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            background: linear-gradient(135deg, #172036, #0f172a);
            border: 1px solid rgba(248, 250, 252, 0.15);
            border-radius: 16px;
            padding: 24px 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: var(--doctor-white);
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        header p {
            margin: 0 0 4px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .warning-text {
            font-size: 0.75rem;
            color: var(--boss-red);
            margin-top: 4px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--boss-blue);
            margin-top: 4px;
            margin-bottom: 6px;
        }

        .collab-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            opacity: 0.8;
            margin-top: 8px;
        }

        .admin-trigger {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            font-size: 0.8rem;
            color: var(--doctor-white);
            opacity: 0.3;
            transition: opacity 0.2s ease;
        }
        .admin-trigger:active {
            opacity: 1;
        }

        #passwordBox {
            display: none;
            margin-top: 14px;
            background: rgba(11, 15, 25, 0.98);
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--boss-blue);
            text-align: center;
        }
        #passwordBox input {
            width: 55%;
            display: inline-block;
            margin-right: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Gowun Dodum', sans-serif;
        }
        #passwordBox button {
            width: 32%;
            display: inline-block;
            padding: 10px;
            background-color: var(--boss-blue);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Gowun Dodum', sans-serif;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #adminPanel {
            display: none;
            border-color: rgba(251, 113, 133, 0.4);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem !important;
            box-sizing: border-box;
            font-family: 'Gowun Dodum', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--boss-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--boss-red);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Gowun Dodum', sans-serif;
            margin-top: 6px;
        }

        .search-box {
            margin-bottom: 14px;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            display: flex;
            flex-direction: column;
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 12px;
        }

        .ranking-main {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            min-height: 40px;
        }

        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a233a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1.5px solid var(--border-color);
            color: var(--text-sub);
            flex-shrink: 0;
            z-index: 2;
        }

        .rank-badge.top-1 { 
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(217, 119, 6, 0.15)); 
            color: #fde047; 
            border: 2px solid #fbbf24; 
        }
        .rank-badge.top-2 { 
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(148, 163, 184, 0.1)); 
            color: #f8fafc; 
            border: 2px solid #cbd5e1; 
        }
        .rank-badge.top-3 { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(180, 83, 9, 0.1)); 
            color: #fb923c; 
            border: 2px solid #f59e0b; 
        }

        .player-detail {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            z-index: 1;
        }

        .player-detail * {
            pointer-events: auto;
        }

        .rank-1 .player-name { font-size: 1.15rem; color: #fde047; font-weight: 800; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .rank-1 .player-score { font-size: 0.95rem; color: #fef08a; font-weight: bold; }

        .rank-2 .player-name { font-size: 1.1rem; color: #f8fafc; font-weight: 800; text-shadow: 0 0 8px rgba(248, 250, 252, 0.3); }
        .rank-2 .player-score { font-size: 0.9rem; color: #e2e8f0; font-weight: bold; }

        .rank-3 .player-name { font-size: 1.05rem; color: #fb923c; font-weight: 800; text-shadow: 0 0 8px rgba(251, 146, 60, 0.3); }
        .rank-3 .player-score { font-size: 0.85rem; color: #fed7aa; font-weight: bold; }

        .rank-4 .player-name { font-size: 0.96rem; } .rank-4 .player-score { font-size: 0.79rem; }
        .rank-5 .player-name { font-size: 0.94rem; } .rank-5 .player-score { font-size: 0.78rem; }
        .rank-6 .player-name { font-size: 0.92rem; } .rank-6 .player-score { font-size: 0.77rem; }
        .rank-7 .player-name { font-size: 0.90rem; } .rank-7 .player-score { font-size: 0.76rem; }
        .rank-8 .player-name { font-size: 0.88rem; } .rank-8 .player-score { font-size: 0.75rem; }
        .rank-9 .player-name { font-size: 0.86rem; } .rank-9 .player-score { font-size: 0.74rem; }
        .rank-10 .player-name { font-size: 0.84rem; } .rank-10 .player-score { font-size: 0.73rem; }

        .player-name {
            font-weight: bold;
            font-size: 0.84rem;
            margin-bottom: 2px;
            word-break: break-all;
        }

        .player-score {
            font-size: 0.73rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .player-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
            align-items: center;
            z-index: 3;
        }

        .badge-btn {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--boss-blue);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-family: 'Gowun Dodum', sans-serif;
            white-space: nowrap;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--boss-red);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 6px 4px;
            font-family: 'Gowun Dodum', sans-serif;
        }

        .comment-box {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(19, 27, 46, 0.7);
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 2.5px solid var(--boss-blue);
            line-height: 1.4;
            word-break: break-all;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="admin-trigger" onclick="togglePasswordBox()" title="관리자">⚪</button>
            
            <h1>초봉식쉼터 : 우리동네 후레쉬봉 기록</h1>
            <p>순위등록을 원하시는 분께서는 방장찾아주세요~</p>
            <div class="warning-text">⚠️ 혹시나 부정행위로 후레쉬봉 하다 뽀록나면… 알죠? 클린 후레쉬봉 합시다!</div>
            <div id="updateInfo" class="update-time">최종 갱신일시 불러오는 중...</div>
            <div class="collab-text">[관리자 : 초봉식쉼터 물갈이 x 방장 민시은 콜라보]</div>
            
            <div id="passwordBox">
                <input type="password" id="adminPwd" placeholder="보안 암호">
                <button onclick="checkPassword()">확인</button>
            </div>
        </header>

        <div class="card" id="adminPanel">
            <h2>🛠️ 랭킹 데이터 관리</h2>
            <div class="form-group">
                <label>플레이어 선택</label>
                <select id="selectPlayer" onchange="onSelectPlayerChange()">
                    <option value="NEW">+ 새로운 플레이어 등록</option>
                </select>
            </div>
            <div class="form-group">
                <label>플레이어 이름</label>
                <input type="text" id="inputName" placeholder="예: 세레니">
            </div>
            <div class="form-group">
                <label>획득 점수</label>
                <input type="number" id="inputScore" placeholder="예: 4512">
            </div>
            <div class="form-group">
                <label>플레이 영상 링크 (선택)</label>
                <input type="text" id="inputLink" placeholder="youtube.com/...">
            </div>
            <div class="form-group">
                <label>플레이어 한마디 / 메모 (선택)</label>
                <input type="text" id="inputComment" placeholder="예: 달성일 또는 메모">
            </div>
            <button class="btn-submit" onclick="savePlayerRecord()">클라우드에 반영하기</button>
        </div>

        <div class="card">
            <h2 style="font-size: 1rem; margin-top: 0; margin-bottom: 12px; color: var(--text-main);">🏆 실시간 랭킹</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 닉네임 검색..." oninput="renderRankings()">
            </div>

            <div class="ranking-list" id="rankingList"></div>
        </div>

        <footer>
            Flashbong Ranking System v1.0
        </footer>
    </div>

    <script>
        const BIN_ID = '6aa3eab6ac6210605ac05f87';       
        const API_KEY = '$2a$10$RmfWAiw2/bYaQ0kXs9tE/O5lorlwX9gAv9xybuHxsLunGPuGw4oFG';   

        let rankings = [];
        let updatedAt = "";

        const defaultRankings = [
            { name: "세레니", score: 4512 },
            { name: "백수의왕한울이", score: 3976 },
            { name: "청년주먹조벤츠", score: 3548 },
            { name: "MAF6352421 (나공주)", score: 3351 },
            { name: "핵봉식", score: 3304 },
            { name: "화랑굇수 (나공주)", score: 3056 },
            { name: "주영바라기", score: 2791 },
            { name: "라이레오", score: 2586 },
            { name: "20211018", score: 2541 },
            { name: "콧노래벤", score: 2293 },
            { name: "무과금복귀유저 부방장", score: 2200 },
            { name: "봉식이오랜만", score: 2196 },
            { name: "방장", score: 2101 },
            { name: "문년기사김봉식", score: 2086 },
            { name: "기사식당김봉식", score: 2067 },
            { name: "야마하", score: 2056 },
            { name: "주악꾸억주의", score: 2006 },
            { name: "코끼리코야", score: 1829 },
            { name: "팀쩔(나공주)", score: 1827 },
            { name: "야승(나공주)", score: 1821 },
            { name: "물오뎅", score: 1794 },
            { name: "칠산동하이바", score: 1793 },
            { name: "찌림이", score: 1777 },
            { name: "qekfdsr", score: 1745 },
            { name: "maf7784418", score: 1711 },
            { name: "김사덕", score: 1704 },
            { name: "물갈이", score: 1674 },
            { name: "케르베로스", score: 1546 },
            { name: "왕과봉식", score: 1484 },
            { name: "드가자", score: 1440 },
            { name: "가가사", score: 1371 },
            { name: "망빙", score: 1330 },
            { name: "얄(circ)", score: 1318 },
            { name: "전준뎅", score: 1306 },
            { name: "심통 부방장", score: 1272 },
            { name: "달려라김봉식.", score: 1253 },
            { name: "통통한새우초밥", score: 1250 },
            { name: "ㅈㅎㅈㅎ", score: 1249 },
            { name: "언리밋", score: 1206 },
            { name: "바렐", score: 1200 },
            { name: "utg", score: 1173 },
            { name: "대우로얄뉴로얄 2대방장", score: 1167 },
            { name: "이나바라기", score: 1133 },
            { name: "암흑의어둠단검 (나공주)", score: 1112 },
            { name: "김룡", score: 1067 },
            { name: "부억(나공주서버)", score: 1038 },
            { name: "인생은니나노", score: 1036 },
            { name: "유디", score: 1014 },
            { name: "봉식을품은달", score: 1004 },
            { name: "데이세븐", score: 739 },
            { name: "뜨뜨", score: 733 },
            { name: "천마백호", score: 700 },
            { name: "대륙간탄도미사일", score: 671 },
            { name: "석봉아", score: 669 },
            { name: "천마봉식.", score: 345 }
        ];

        async function fetchRankings() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                
                if (data.record && data.record.rankings && data.record.rankings.length > 0) {
                    rankings = data.record.rankings;
                    updatedAt = data.record.updatedAt || "2026/09/11 22:00";
                } else {
                    rankings = defaultRankings;
                    updatedAt = getFormattedDate();
                    await saveRankingsToCloud();
                }
                
                updateHeaderInfo();
                renderRankings();
                if (document.getElementById("adminPanel").style.display === "block") {
                    updatePlayerSelectOptions();
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                rankings = defaultRankings;
                renderRankings();
            }
        }

        async function saveRankingsToCloud() {
            try {
                updatedAt = getFormattedDate();
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ rankings: rankings, updatedAt: updatedAt })
                });
                if (response.ok) {
                    updateHeaderInfo();
                    renderRankings();
                    updatePlayerSelectOptions();
                    alert("랭킹 데이터가 클라우드에 실시간 반영되었습니다!");
                }
            } catch (error) {
                console.error("데이터 저장 실패:", error);
                alert("저장 중 오류가 발생했습니다.");
            }
        }

        function getFormattedDate() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        function updateHeaderInfo() {
            document.getElementById("updateInfo").textContent = `최종 갱신일시 : ${updatedAt}`;
        }

        function togglePasswordBox() {
            const box = document.getElementById("passwordBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        function checkPassword() {
            const pwd = document.getElementById("adminPwd").value;
            if (pwd === "1234") {
                document.getElementById("adminPanel").style.display = "block";
                document.getElementById("passwordBox").style.display = "none";
                document.getElementById("adminPwd").value = "";
                updatePlayerSelectOptions();
                renderRankings();
                alert("관리자 모드가 승인되었습니다.");
            } else {
                alert("보안 암호가 올바르지 않습니다.");
            }
        }

        function updatePlayerSelectOptions() {
            const select = document.getElementById("selectPlayer");
            select.innerHTML = '<option value="NEW">+ 새로운 플레이어 등록</option>';
            rankings.forEach((p, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${p.name} (${p.score.toLocaleString()}점)`;
                select.appendChild(opt);
            });
        }

        function onSelectPlayerChange() {
            const val = document.getElementById("selectPlayer").value;
            if (val === "NEW") {
                document.getElementById("inputName").value = "";
                document.getElementById("inputScore").value = "";
                document.getElementById("inputLink").value = "";
                document.getElementById("inputComment").value = "";
            } else {
                const p = rankings[val];
                document.getElementById("inputName").value = p.name;
                document.getElementById("inputScore").value = p.score;
                document.getElementById("inputLink").value = p.link || "";
                document.getElementById("inputComment").value = p.comment || "";
            }
        }

        function savePlayerRecord() {
            let name = document.getElementById("inputName").value.trim();
            let score = parseInt(document.getElementById("inputScore").value);
            let link = document.getElementById("inputLink").value.trim();
            let comment = document.getElementById("inputComment").value.trim();

            if (!name || isNaN(score)) {
                alert("이름과 점수를 정확히 입력해 주세요.");
                return;
            }

            if (link && !link.startsWith('http://') && !link.startsWith('https://')) {
                link = 'https://' + link;
            }

            const selectedIdx = document.getElementById("selectPlayer").value;

            if (selectedIdx === "NEW") {
                const existing = rankings.find(p => p.name === name);
                if (existing) {
                    existing.score = score;
                    existing.link = link;
                    existing.comment = comment;
                } else {
                    rankings.push({ name, score, link, comment });
                }
            } else {
                const idx = parseInt(selectedIdx);
                rankings[idx].name = name;
                rankings[idx].score = score;
                rankings[idx].link = link;
                rankings[idx].comment = comment;
            }

            rankings.sort((a, b) => b.score - a.score);
            saveRankingsToCloud();

            document.getElementById("selectPlayer").value = "NEW";
            onSelectPlayerChange();
        }

        function removePlayer(index) {
            if (confirm(`${rankings[index].name}님의 기록을 삭제하시겠습니까?`)) {
                rankings.splice(index, 1);
                saveRankingsToCloud();
            }
        }

        function renderRankings() {
            const listEl = document.getElementById("rankingList");
            const searchKeyword = document.getElementById("searchInput").value.toLowerCase().trim();
            listEl.innerHTML = "";

            // 전체 점수 기준 정렬 보장
            rankings.sort((a, b) => b.score - a.score);

            // 원본 인덱스(전체 순위)를 보존한 채 검색 필터링 수행
            const filtered = rankings.map((player, originalIndex) => ({ ...player, originalIndex }))
                                      .filter(player => player.name.toLowerCase().includes(searchKeyword));

            if (filtered.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px;">등록된 기록이 없습니다.</div>`;
                return;
            }

            filtered.forEach((player) => {
                const realRank = player.originalIndex + 1; // 전체 순위(진짜 등수) 유지
                let rankClass = "";
                let rankStyleClass = `rank-${realRank}`;

                if (realRank === 1) rankClass = "top-1";
                else if (realRank === 2) rankClass = "top-2";
                else if (realRank === 3) rankClass = "top-3";

                let html = `
                    <div class="ranking-item">
                        <div class="ranking-main">
                            <div class="rank-badge ${rankClass}">${realRank}</div>
                            <div class="player-detail ${rankStyleClass}">
                                <div class="player-name">${escapeHtml(player.name)}</div>
                                <div class="player-score">${player.score.toLocaleString()}점</div>
                            </div>
                            <div class="player-actions">
                `;

                if (player.link) {
                    html += `<a href="${escapeHtml(player.link)}" target="_blank" class="badge-btn">🎥 영상</a>`;
                }

                if (document.getElementById("adminPanel").style.display === "block") {
                    html += `<button class="btn-delete" onclick="removePlayer(${player.originalIndex})">삭제</button>`;
                }

                html += `</div></div>`;

                if (player.comment) {
                    html += `<div class="comment-box">"${escapeHtml(player.comment)}"</div>`;
                }

                html += `</div>`;
                listEl.innerHTML += html;
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        fetchRankings();
    </script>

</body>
</html>
